[workspace]
resolver = "3"
members = ["crates/lightning-core", "crates/lightning"]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
fff-search = "0.11.0"
windows = "0.62.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# fff-search 0.11.0 with the watcher fixes in vendor/fff-search/LIGHTNING.md.
[patch.crates-io]
fff-search = { path = "vendor/fff-search" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Benchmarks must measure the same code we ship.
[profile.bench]
lto = "fat"
codegen-units = 1
